      - 有価証券報告書
    explanation: 軽微な開示資料修正(過年度決算訂正はTier 1で扱う)

  - id: ex_articles_formal_change
    tier: exclude
    category: 除外
    priority: 100
    positive_keywords:
      - 定款の一部変更
    negative_keywords:
      - 買収
      - 防衛
    explanation: 定款の形式的変更

  - id: ex_agm_notice
    tier: exclude
    category: 除外
    priority: 100
    positive_keywords:
      - 招集ご通知
      - 招集通知
      - 株主総会資料の電子提供
