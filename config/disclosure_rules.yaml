  - id: ex_briefing_and_ir_materials
    tier: exclude
    category: 除外
    priority: 100
    positive_keywords:
      - 決算説明会開催
      - 説明会開催のお知らせ
      - 説明会資料
      - 説明資料の掲載
      - ir資料
      - 資料掲載のお知らせ
      - 決算補足説明資料
      - 決算説明資料
    explanation: 説明会案内・IR資料掲載のみの開示

  - id: ex_minor_correction
    tier: exclude
    category: 除外
    priority: 95
    positive_keywords:
      - 一部訂正
      - 数値データ訂正
      - 訂正について
      - 記載事項の訂正
