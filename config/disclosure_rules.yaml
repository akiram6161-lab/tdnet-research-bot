# Tier判定ルール(仕様書 §10〜§13)
#
# - キーワードは正規化済みタイトル(NFKC・小文字化・空白/句読点除去)に部分一致で適用される
# - tier: 1 / 2 / exclude
# - 除外ルール(tier: exclude)は一般ルールより常に優先される
# - 同時マッチ時は priority が大きいルールを採用、同点なら Tier の小さい方
rules:
  # ============================================================
  # 除外ルール(仕様 §13)- priority 100
  # ============================================================
  - id: ex_treasury_buyback_monthly
    tier: exclude
    category: 除外
    priority: 100
    positive_keywords:
      - 自己株式の取得状況
      - 自己株式取得状況
      - 自己株式の取得結果
      - 自己株式立会外買付取引
    explanation: 自己株式取得状況の定例月次報告

  - id: ex_warrant_exercise_status
    tier: exclude
    category: 除外
    priority: 100
    positive_keywords:
      - 行使状況
    explanation: 新株予約権等の定例行使状況報告

  - id: ex_stock_compensation_regular
    tier: exclude
    category: 除外
    priority: 100
    positive_keywords:
      - 譲渡制限付株式報酬
      - 譲渡制限付株式ユニット
      - ストックオプション
      - 株式給付信託
      - 従業員持株
