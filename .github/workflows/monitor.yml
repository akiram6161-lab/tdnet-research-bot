name: TDnet Monitor

on:
  schedule:
    # UTC基準。JSTの監視時間判定はアプリ側で行う(仕様 §5)。
    # 22:30 UTC(=07:30 JST)〜11:15 UTC(=20:15 JST)前後のみ起動して無駄実行を減らす。
    - cron: "7,22,37,52 22-23 * * 0-4"
    - cron: "7,22,37,52 0-11 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "監視時間外でも実行する(動作確認用)"
        type: boolean
        default: false

concurrency:
  group: tdnet-research-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 自動リサーチ(最大2件/回、各10分タイムアウト)を考慮
    env:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      SLACK_ALLOWED_USER_IDS: ${{ secrets.SLACK_ALLOWED_USER_IDS }}
      # 自動リサーチ: Claude Code(サブスクリプション認証)
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      EDINET_DB_API_KEY: ${{ secrets.EDINET_DB_API_KEY }}
      JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      RESEARCH_SCORE_THRESHOLD: ${{ vars.RESEARCH_SCORE_THRESHOLD || '80' }}
      # プライベート運用中はActions無料枠(2,000分/月)に収めるため既定5件/日。
      # パブリック化したらリポジトリ変数 MAX_AUTO_RESEARCH_PER_DAY で引き上げ可
      MAX_AUTO_RESEARCH_PER_DAY: ${{ vars.MAX_AUTO_RESEARCH_PER_DAY || '5' }}
      # force指定時は監視時間チェックを事実上無効化(平日のみ・動作確認用)
      MONITOR_START: ${{ inputs.force && '00:00' || '07:45' }}
      MONITOR_END: ${{ inputs.force && '23:59' || '20:00' }}
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      # 速報・ダイジェストまでを実行。claude CLI未導入なのでリサーチはqueuedのまま残る
      - name: Run monitor
        run: python -m src.main

      # リサーチ待ちがある時だけclaude CLIをインストールして実行(Actions分数の節約)
      - name: Check research queue
        id: queue
        run: |
          count=$(grep -c '"research_status": "queued"' state/state.json || true)
          echo "queued=${count}" >> "$GITHUB_OUTPUT"
          echo "queued research jobs: ${count}"

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.queued != '0'
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        if: steps.queue.outputs.queued != '0'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run research
        if: steps.queue.outputs.queued != '0'
        run: python -m src.main --research-only

      - name: Commit state if changed
        run: |
          if git status --porcelain state/state.json | grep -q .; then
            git config user.name "tdnet-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/state.json
            git commit -m "chore: update state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No state changes; skipping commit."
          fi
