name: TDnet Monitor

on:
  schedule:
    # UTC基準。JSTの監視時間判定はアプリ側で行う(仕様 §5)。
    # 22:30 UTC(=07:30 JST)〜11:15 UTC(=20:15 JST)前後のみ起動して無駄実行を減らす。
    - cron: "*/15 22-23 * * 0-4"
    - cron: "*/15 0-11 * * 1-5"
  workflow_dispatch:

concurrency:
  group: tdnet-research-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 自動リサーチ(最大2件/回、各10分タイムアウト)を考慮
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          pip install -e .
          npm install -g @anthropic-ai/claude-code

      - name: Run monitor
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_ALLOWED_USER_IDS: ${{ secrets.SLACK_ALLOWED_USER_IDS }}
          # 自動リサーチ: Claude Code(サブスクリプション認証)
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          EDINET_DB_API_KEY: ${{ secrets.EDINET_DB_API_KEY }}
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          RESEARCH_SCORE_THRESHOLD: ${{ vars.RESEARCH_SCORE_THRESHOLD || '80' }}
          MAX_AUTO_RESEARCH_PER_DAY: ${{ vars.MAX_AUTO_RESEARCH_PER_DAY || '15' }}
          TZ: Asia/Tokyo
        run: python -m src.main

      - name: Commit state if changed
        run: |
          if git status --porcelain state/state.json | grep -q .; then
            git config user.name "tdnet-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state/state.json
            git commit -m "chore: update state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No state changes; skipping commit."
          fi
