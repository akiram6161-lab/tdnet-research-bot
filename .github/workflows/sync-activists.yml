name: Sync Activist List

on:
  schedule:
    # 毎週月曜 7:10 JST(22:10 UTC 日曜)に EDINET DB から最新化
    - cron: "10 22 * * 0"
  workflow_dispatch:

concurrency:
  group: tdnet-sync-activists
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Sync activists.csv
        env:
          EDINET_DB_API_KEY: ${{ secrets.EDINET_DB_API_KEY }}
          TZ: Asia/Tokyo
        run: python -m src.main --sync-activists

      - name: Commit if changed
        run: |
          if git status --porcelain config/activists.csv | grep -q .; then
            git config user.name "tdnet-research-bot"
            git config user.email "actions@users.noreply.github.com"
            git add config/activists.csv
            git commit -m "chore: weekly activist list sync [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No changes."
          fi
